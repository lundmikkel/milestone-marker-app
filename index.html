<!doctype html>
<html lang="en" data-bs-theme="light">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Milestone Marker</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    />
  </head>
  <body>
    <main>
      <div class="container col-xl-10 col-xxl-8 px-4 py-5">
        <div class="row align-items-center g-lg-5 py-5">
          <div class="col-lg-7 text-center text-lg-start">
            <h1 class="display-4 fw-bold lh-1 text-body-emphasis mb-3">Milestone Marker</h1>
            <p class="col-lg-10 fs-4">
              Select a milestone date to generate the activity feed URL for that day.
              Use the generated link to access the Milestone Marker feed for your chosen
              date.
            </p>
          </div>
          <div class="col-md-10 mx-auto col-lg-5">
            <form id="feed-form" class="p-4 p-md-5 border rounded-3 bg-body-tertiary">
              <div class="form-floating mb-3">
                <input
                  type="date"
                  class="form-control"
                  id="milestone-date"
                  placeholder="YYYY-MM-DD"
                  required
                />
                <label for="milestone-date">Milestone date</label>
              </div>
              <button class="w-100 btn btn-lg btn-primary" type="submit" id="generate-btn" disabled>
                Generate Feed
              </button>
              <div id="feed-output" class="alert alert-primary mt-4 mb-0 d-none" role="status">
                <span class="fw-semibold d-block mb-3">Feed URL</span>
                <div class="input-group">
                  <input
                    type="text"
                    class="form-control"
                    id="feed-url"
                    readonly
                    aria-label="Generated feed URL"
                  />
                  <button
                    type="button"
                    class="btn btn-outline-secondary"
                    id="copy-btn"
                    aria-label="Copy feed URL"
                  >
                    <i class="bi bi-clipboard"></i>
                  </button>
                </div>
              </div>
            </form>
          </div>
        </div>
      </div>
    </main>
    <script>
      (function () {
        const form = document.getElementById('feed-form');
        const dateInput = document.getElementById('milestone-date');
        const generateButton = document.getElementById('generate-btn');
        const feedOutput = document.getElementById('feed-output');
        const feedUrlInput = document.getElementById('feed-url');
        const copyButton = document.getElementById('copy-btn');

        const baseUrl = 'https://fa-milestone-marker-efhuhja9gqezgjfv.swedencentral-01.azurewebsites.net/api/feed/';
        copyButton.disabled = true;

        dateInput.addEventListener('input', () => {
          generateButton.disabled = !dateInput.value;
          if (!dateInput.value) {
            feedOutput.classList.add('d-none');
            feedUrlInput.value = '';
            copyButton.disabled = true;
          }
        });

        form.addEventListener('submit', (event) => {
          event.preventDefault();
          const selectedDate = dateInput.value;

          if (!selectedDate) {
            return;
          }

          const feedUrl = `${baseUrl}${selectedDate}`;
          feedUrlInput.value = feedUrl;
          copyButton.disabled = false;
          feedOutput.classList.remove('d-none');
          feedUrlInput.focus();
          feedUrlInput.select();
        });

        feedUrlInput.addEventListener('focus', () => {
          feedUrlInput.select();
        });

        feedUrlInput.addEventListener('mouseup', (event) => {
          event.preventDefault();
        });

        copyButton.addEventListener('click', async () => {
          if (!feedUrlInput.value) {
            return;
          }

          try {
            await navigator.clipboard.writeText(feedUrlInput.value);
          } catch (error) {
            feedUrlInput.select();
            document.execCommand('copy');
          }
        });
      })();
    </script>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
